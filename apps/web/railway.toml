[build]
builder = "NIXPACKS"

[build.nixpacksConfig]
installCmd = "pnpm install"
buildCmd = "pnpm --filter web build"
startCmd = "pnpm --filter web start"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production.variables]
NODE_ENV = "production"
PORT = "3000"